name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    uses: ./.github/workflows/ios.yml

  desktop:
    name: instalador · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-15 }
          - { name: mac-intel, os: macos-15-intel }
          - { name: windows,   os: windows-latest }
    defaults:
      run:
        working-directory: receiver
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller

      - name: Tests
        run: |
          python -m tests.test_web
          python -m tests.test_protocol

      - name: Empaquetar (Mac)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name RemoteHub \
            --osx-bundle-identifier com.chimichurria.remotehub.receiver \
            --add-data "remotehub/web:remotehub/web" \
            --collect-all zeroconf \
            --hidden-import pynput.keyboard._darwin --hidden-import pynput.mouse._darwin \
            run_remotehub.py
          echo "BIN=dist/RemoteHub.app/Contents/MacOS/RemoteHub" >> "$GITHUB_ENV"

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --name RemoteHub \
            --add-data "remotehub/web;remotehub/web" \
            --collect-all zeroconf \
            --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 \
            run_remotehub.py
          echo "BIN=dist/RemoteHub/RemoteHub.exe" >> "$GITHUB_ENV"

      - name: Probar el binario (arranca, sirve el control web y el QR)
        run: |
          "$BIN" --dry-run --no-open > smoke.log 2>&1 &
          PID=$!
          UP=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null 2>&1; then UP=1; break; fi
            kill -0 $PID 2>/dev/null || { echo "el proceso terminó solo"; break; }
            sleep 1
          done
          if [ "$UP" != 1 ]; then
            echo "::error::el binario no arrancó"; echo "--- smoke.log"; cat smoke.log
            echo "--- proceso vivo?"; kill -0 $PID 2>&1 || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:8765/health
          curl -fsS http://127.0.0.1:8765/ | grep -q "RemoteHub"
          curl -fsS http://127.0.0.1:8765/pair | grep -q "<svg"
          kill $PID || true
          echo "binario OK"; tail -n 20 smoke.log || true

      - name: Zip (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/RemoteHub.app "RemoteHub-${{ matrix.name }}.zip"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/RemoteHub -DestinationPath "RemoteHub-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteHub-${{ matrix.name }}
          path: receiver/RemoteHub-${{ matrix.name }}.zip

  publish:
    needs: [ios, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Renombrar el .ipa
        run: |
          ls -R assets
          mv assets/RemoteHub-unsigned.ipa assets/RemoteHub-iPhone-Watch-unsigned.ipa
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: assets/*
          generate_release_notes: true
