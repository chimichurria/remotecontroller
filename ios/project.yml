# Generar el proyecto de Xcode con:  brew install xcodegen && xcodegen
# Antes: cambiá bundleIdPrefix y DEVELOPMENT_TEAM por los tuyos.
name: RemoteHub
options:
  bundleIdPrefix: com.chimichurria      # cambialo si compilás con tu propia cuenta
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""           # <- tu Team ID de Apple Developer
    CODE_SIGN_STYLE: Automatic
targets:
  RemoteHub:
    type: application
    platform: iOS
    sources: [RemoteHub]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chimichurria.remotehub   
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: RemoteHub/Info.plist
      properties:
        CFBundleDisplayName: RemoteHub
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Para encontrar y controlar tu Mac o PC en la red local.
        NSBonjourServices: ["_remotehub._tcp"]
        NSCameraUsageDescription: Para usar el iPhone como cámara con disparador remoto.
        NSPhotoLibraryAddUsageDescription: Para guardar las fotos que disparás de forma remota.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: remotehub
            CFBundleURLSchemes: [remotehub]
        LSApplicationQueriesSchemes: [shortcuts]
    dependencies:
      - target: RemoteHubWatch
  RemoteHubWatch:
    type: application
    platform: watchOS
    sources: [RemoteHubWatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chimichurria.remotehub.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: RemoteHubWatch/Info.plist
      properties:
        CFBundleDisplayName: RemoteHub
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.chimichurria.remotehub
        NSLocalNetworkUsageDescription: Para conectarse directo a tu compu por Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
